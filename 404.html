<script>
const copy = {
  "en": {

  "nl": {

    footerStartTrial:'⚡ Gratis Beginnen',
    "navAbout": "Over ons", "navSolutionsLink": "Oplossingen",
    "navContact": "Contact",
    "navDemo": "Probeer het",
    "navHome": "Home",
    "navPricing": "Prijzen",
    "navSolutions": "Oplossingen",
    "nfDemo": "Probeer de Demo",
    "nfDesc": "De pagina die je zoekt bestaat niet of is verplaatst. Laten we je terug op weg helpen.",
    "nfHome": "Terug naar Home",
    "nfTitle": "Pagina niet gevonden"
  },
  "fr": {
    navSignIn:'Se connecter',
    navStartTrial:'⚡ Commencer Gratuitement',
    footerStartTrial:'⚡ Commencer Gratuitement',
    "navAbout": "À propos", "navSolutionsLink": "Solutions",
    "navContact": "Contact",
    "navDemo": "Essayez-le",
    "navHome": "Accueil",
    "navPricing": "Tarifs",
    "navSolutions": "Solutions",
    "nfDemo": "Essayer la démo",
    "nfDesc": "La page que vous recherchez n'existe pas ou a été déplacée. Reprenons le bon chemin.",
    "nfHome": "Retour à l'accueil",
    "nfTitle": "Page introuvable"
  }
};

const root = document.documentElement;
const langButtons = document.querySelectorAll('.lang-btn');
const navElement = document.getElementById('site-nav');
const menuToggleBtn = document.querySelector('[data-menu-toggle]');
const themeBtn = document.querySelector('[data-theme-toggle]');

let uiLang;
try { uiLang = localStorage.getItem('nexify_lang') || 'en'; } catch(e) { uiLang = 'en'; }

function setUiLanguage(lang){
  uiLang = lang;
  root.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(copy[lang] && copy[lang][key]) el.textContent = copy[lang][key];
  });
  langButtons.forEach(btn=>{
    const active = btn.dataset.lang === lang;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  try { localStorage.setItem('nexify_lang', lang); } catch(e){}
}
langButtons.forEach(btn => btn.addEventListener('click', () => setUiLanguage(btn.dataset.lang)));

if(menuToggleBtn && navElement) {
  menuToggleBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const isOpen = navElement.classList.toggle('open');
    menuToggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  navElement.querySelectorAll('a').forEach(link=>link.addEventListener('click', ()=>{
    navElement.classList.remove('open');
    menuToggleBtn.setAttribute('aria-expanded','false');
  }));
  document.addEventListener('click', ()=>{
    if(navElement.classList.contains('open')){
      navElement.classList.remove('open');
      menuToggleBtn.setAttribute('aria-expanded','false');
    }
  });
}

let theme = 'light';
try {
  const saved = localStorage.getItem('nexify_theme');
  if (saved) theme = saved;
  else if (matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
} catch(e) {}
function renderTheme(){
  root.setAttribute('data-theme', theme);
}
if(themeBtn) themeBtn.addEventListener('click', ()=>{
  theme = theme === 'dark' ? 'light' : 'dark';
  renderTheme();
  try { localStorage.setItem('nexify_theme', theme); } catch(e){}
});
renderTheme();
setUiLanguage(uiLang);

</script>


<!-- NexifyAI live assistant (SaaS widget, nexifyai-demo tenant; same chat-bubble icon, site green) -->
<!-- NexifyAI assistant: injected on first user interaction (leaner load, no third-party JS until engaged) -->
<script>
(function(){
  var done=false;
  function inject(){
    if(done)return;done=true;
    var s=document.createElement("script");
    s.src="https://agent.nexifyai.org/widget/widget.js";s.async=true;
    s.setAttribute("data-tenant","nexifyai-demo");
    s.setAttribute("data-api-base","https://agent.nexifyai.org");
    s.setAttribute("data-mode","live");
    document.body.appendChild(s);
    ["pointerdown","keydown","touchstart"].forEach(function(ev){removeEventListener(ev,inject);});
  }
  ["pointerdown","keydown","touchstart"].forEach(function(ev){addEventListener(ev,inject,{passive:true});});
})();
</script>
